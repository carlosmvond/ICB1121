<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malla ICB · Editor curricular</title>
<style>
:root{
  --ink:#EEF2F6;
  --ink-2:#FFFFFF;
  --ink-3:#F2F5F8;
  --line:#C4D0DD;
  --line-soft:#E2E8EF;
  --paper:#12202E;
  --muted:#5E7185;
  --accent:#6D28D9;
  --accent-ink:#FFFFFF;
  --danger:#D92D3F;
  --warn:#B4700A;
  --ok:#0F8A62;
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --col-w:186px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--paper);
  font-family:var(--font-sans);font-size:14px;
  display:flex;flex-direction:column;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- barra superior ---------- */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 16px;background:var(--ink-2);border-bottom:1px solid var(--line);
  box-shadow:0 1px 3px rgba(20,40,60,.09);
}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:4px}
.brand b{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.brand span{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.counters{display:flex;gap:14px;font-family:var(--font-mono);font-size:12px}
.counters div{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.counters b{font-size:16px;font-weight:600}
.counters small{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.counters .bad b{color:var(--danger)}
.counters .good b{color:var(--ok)}
.spacer{flex:1 1 auto}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{
  background:var(--ink-3);border:1px solid var(--line);border-radius:6px;
  padding:6px 11px;font-size:12.5px;transition:background .12s,border-color .12s;
}
.btn:hover{background:#E4EAF1;border-color:#A9B9C9}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:#5B1FBC}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.field{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.field input,.field select{
  background:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:5px 7px;
  font-family:var(--font-mono);font-size:12px;
}
.field input[type=number]{width:56px}

/* ---------- tablero ---------- */
.board-wrap{flex:1 1 auto;overflow:auto;position:relative}
.board{position:relative;min-height:100%;padding:0 16px 90px;width:max-content}
.grid{display:flex;gap:10px;align-items:flex-start;position:relative;z-index:2}
.col{width:var(--col-w);flex:0 0 var(--col-w);display:flex;flex-direction:column}

.yearband{
  position:sticky;top:0;z-index:5;background:var(--ink);padding-top:12px;
}
.year{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);padding:0 0 4px 2px;
}
.head{
  background:var(--ink-2);border:1px solid var(--line);border-radius:8px 8px 0 0;
  padding:8px 10px 6px;
}
.head h3{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.02em}
.metrics{display:flex;align-items:baseline;gap:8px;margin-top:3px;font-family:var(--font-mono)}
.metrics .cr{font-size:19px;font-weight:600;line-height:1}
.metrics .cum{font-size:11px;color:var(--muted)}
.head.over .cr{color:var(--warn)}
.head.over{border-color:var(--warn)}
/* regla de créditos: la firma de la app */
.ruler{height:6px;background:var(--ink-3);border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative;overflow:hidden}
.ruler i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#93A7BA,#4C627A);display:block}
.head.over + .ruler i{background:linear-gradient(90deg,#E0A94A,var(--warn))}
.milestone{
  position:relative;height:0;
}
.flag{
  position:absolute;top:2px;left:0;right:0;font-family:var(--font-mono);font-size:9.5px;
  letter-spacing:.05em;color:var(--accent);border-top:1px dashed var(--accent);padding-top:2px;
}
.body{
  background:var(--ink-2);border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;
  padding:8px;min-height:120px;display:flex;flex-direction:column;gap:7px;flex:1 1 auto;
}
.body.dragover{background:#EDE7FB;border-color:var(--accent)}

/* ---------- tarjetas ---------- */
.card{
  position:relative;border-radius:6px;padding:7px 8px 6px;color:#0E1720;cursor:grab;
  border:1.5px solid rgba(0,0,0,.34);box-shadow:0 1px 2px rgba(20,40,60,.18);
  transition:transform .1s,box-shadow .1s,opacity .1s;
}
.card:active{cursor:grabbing}
.card .code{font-family:var(--font-mono);font-size:10.5px;font-weight:700;opacity:.75;letter-spacing:.03em}
.card .name{font-size:11.5px;line-height:1.25;margin-top:1px;font-weight:600}
.card .cr{
  position:absolute;top:6px;right:7px;font-family:var(--font-mono);font-size:11px;font-weight:700;
  background:rgba(0,0,0,.16);border-radius:4px;padding:0 4px;
}
.card.key{border-color:#0C1218;border-width:2.5px}
.card.bl{border-style:dotted;border-width:2.5px}
.card.sel{box-shadow:0 0 0 2.5px var(--accent),0 4px 12px rgba(20,40,60,.28);transform:translateY(-1px)}
.card.err{box-shadow:0 0 0 2.5px var(--danger)}
.card.err.sel{box-shadow:0 0 0 2.5px var(--accent),0 0 0 5.5px rgba(217,45,63,.6)}
.card.dragging{opacity:.35}
.card.dim{opacity:.34}
.card .bug{
  position:absolute;left:-6px;top:-6px;width:15px;height:15px;border-radius:50%;
  background:var(--danger);color:#fff;box-shadow:0 0 0 1.5px #fff;font-size:10px;font-weight:700;line-height:15px;text-align:center;
  font-family:var(--font-mono);
}
.card.linking-src{box-shadow:0 0 0 2.5px var(--ok)}
.drop-line{height:2px;background:var(--accent);border-radius:2px;margin:-3px 0}

svg.arrows{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:visible}
svg.arrows path{fill:none;stroke:#7C90A6;stroke-width:1.6}
svg.arrows path.hi{stroke:var(--accent);stroke-width:2.4}
svg.arrows path.bad{stroke:var(--danger);stroke-width:2.4;stroke-dasharray:6 4}

/* ---------- panel lateral ---------- */
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:330px;background:var(--ink-2);
  border-left:1px solid var(--line);z-index:20;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .18s ease;
}
.drawer.open{transform:none}
.drawer header{
  padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;
}
.drawer header h2{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;flex:1}
.drawer .content{padding:14px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.close{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;padding:0 4px}
label.lbl{display:flex;flex-direction:column;gap:4px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
label.lbl input,label.lbl select,label.lbl textarea{
  background:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:7px 8px;font-size:13px;
  font-family:var(--font-sans);color:var(--paper);width:100%;
}
label.lbl input[type=number]{font-family:var(--font-mono)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;gap:14px;font-size:12px;color:var(--paper)}
.checks label{display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;color:var(--paper)}
.sect{border-top:1px solid var(--line-soft);padding-top:12px}
.sect h4{margin:0 0 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chip{
  display:flex;align-items:center;gap:6px;background:var(--ink-3);border:1px solid var(--line);
  border-radius:5px;padding:5px 6px 5px 8px;font-size:12px;margin-bottom:5px;
}
.chip .c{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.chip .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:15px;line-height:1;padding:0 3px}
.chip .x:hover{color:var(--danger)}
.drawer{box-shadow:-6px 0 22px rgba(20,40,60,.13)}
.chip.bad{border-color:var(--danger)}
.empty{color:var(--muted);font-size:12px;font-style:italic}
.issue{
  border-left:3px solid var(--danger);background:#FCEBED;border-radius:0 5px 5px 0;
  padding:7px 9px;margin-bottom:7px;font-size:12px;line-height:1.4;cursor:pointer;
}
.issue.warn{border-left-color:var(--warn);background:#FDF3E2}
.issue b{font-family:var(--font-mono);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:11px;color:var(--muted);padding:8px 16px;background:var(--ink-2);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.hint{color:var(--muted);font-size:11.5px;line-height:1.45}
.modal-back{
  position:fixed;inset:0;background:rgba(18,32,46,.42);z-index:40;
  display:none;align-items:center;justify-content:center;padding:24px;
}
.modal-back.open{display:flex}
.modal{
  background:var(--ink-2);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 18px 50px rgba(20,40,60,.3);max-width:960px;width:100%;
  max-height:100%;overflow:auto;
}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;flex:1}
.modal .pad{padding:18px}
.charts{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
.chart{flex:1 1 300px;min-width:280px;text-align:center}
.chart h3{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chart svg{max-width:100%;height:auto}
.chart .hole b{font-family:var(--font-mono);font-size:26px;font-weight:600}
table.dist{width:100%;border-collapse:collapse;margin-top:20px;font-size:12.5px}
table.dist th{
  text-align:right;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600;
}
table.dist th:first-child{text-align:left}
table.dist td{padding:6px 8px;border-bottom:1px solid var(--line-soft);text-align:right;font-family:var(--font-mono)}
table.dist td:first-child{text-align:left;font-family:var(--font-sans)}
table.dist tr.tot td{border-top:2px solid var(--line);border-bottom:none;font-weight:700}
table.dist i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px;border:1px solid rgba(0,0,0,.28)}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:#12202E;color:#fff;border:1px solid #12202E;box-shadow:0 4px 14px rgba(20,40,60,.25);border-radius:7px;padding:9px 15px;
  font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:760px){.drawer{width:100%}.counters{display:none}}
@media print{
  body{background:#fff;color:#000;overflow:visible;height:auto}
  .topbar,.drawer,.legend,.toast,.modal-back{display:none}
  body.print-dist .board-wrap{display:none}
  body.print-dist .modal-back{display:block;position:static;background:#fff;padding:0}
  body.print-dist .modal{box-shadow:none;border:none;max-width:none;overflow:visible}
  body.print-dist .modal header .btn,body.print-dist .modal header .close{display:none}
  .board-wrap{overflow:visible}
  .head,.body{background:#fff;border-color:#999}
  .head h3,.metrics{color:#000}
  .year{color:#444}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <b>Malla ICB</b>
    <span id="planName">Ing. Civil en Bioprocesos · 11 sem</span>
  </div>
  <div class="counters">
    <div><small>Créditos</small><b id="kTot">—</b></div>
    <div><small>Ramos</small><b id="kCur">—</b></div>
    <div id="kIssuesBox" class="good"><small>Conflictos</small><b id="kIssues">0</b></div>
  </div>
  <div class="spacer"></div>
  <div class="tools">
    <button class="btn primary" id="bAdd">+ Ramo</button>
    <button class="btn" id="bLink" title="Clic aquí, luego el ramo origen y el ramo destino">Conectar</button>
    <div class="field"><span>Flechas</span>
      <select id="selArrows">
        <option value="focus">al seleccionar</option>
        <option value="all">todas</option>
        <option value="errors">solo conflictos</option>
      </select>
    </div>
    <div class="field"><span>Máx cr/sem</span><input type="number" id="inMax" min="0" max="40" value="22"></div>
    <button class="btn" id="bIssues">Conflictos</button>
    <button class="btn" id="bDist">Distribución</button>
    <button class="btn" id="bUndo" title="Ctrl+Z">Deshacer</button>
    <button class="btn" id="bSave">Guardar JSON</button>
    <button class="btn" id="bLoad">Abrir JSON</button>
    <button class="btn" id="bCsv">CSV</button>
    <button class="btn" id="bPng">PNG</button>
    <button class="btn" id="bSvg">SVG</button>
    <button class="btn" id="bPrint">Imprimir</button>
    <button class="btn" id="bReset">Original</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
</div>

<div class="board-wrap" id="boardWrap">
  <div class="board" id="board">
    <svg class="arrows" id="svg"></svg>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="legend" id="legend"></div>

<aside class="drawer" id="drawer">
  <header>
    <h2 id="drawerTitle">Ramo</h2>
    <button class="close" id="drawerClose" aria-label="Cerrar">×</button>
  </header>
  <div class="content" id="drawerBody"></div>
</aside>

<div class="modal-back" id="distBack">
  <div class="modal">
    <header>
      <h2>Distribución de la malla</h2>
      <button class="btn" id="distPrint">Imprimir</button>
      <button class="close" id="distClose" aria-label="Cerrar">×</button>
    </header>
    <div class="pad" id="distBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

/* ============================================================
   2. Estado
   ============================================================ */
let state = clone(ORIGINAL);
let selected = null;         // id del ramo seleccionado
let linkFrom = null;         // origen mientras se conectan flechas
let linkMode = false;
let arrowMode = "focus";
let hovered = null;
let drawerView = "course";   // "course" | "issues"
const history = [];

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function byId(id){ return state.courses.find(c=>c.id===id); }
function ofSem(s){ return state.courses.filter(c=>c.s===s); }
function snapshot(){ history.push(JSON.stringify(state)); if(history.length>60) history.shift(); }

/* ============================================================
   3. Cálculos y validación
   ============================================================ */
function semCredits(){
  const t = Array(N_SEM+1).fill(0);
  state.courses.forEach(c => { if(c.s>=1 && c.s<=N_SEM) t[c.s]+=Number(c.c)||0; });
  return t;
}
function cumulative(){
  const t = semCredits(); const cum = Array(N_SEM+1).fill(0); let acc=0;
  for(let s=1;s<=N_SEM;s++){ acc+=t[s]; cum[s]=acc; }
  return cum;
}
function creditsBefore(sem){
  return state.courses.reduce((sum,c)=> c.s < sem ? sum + (Number(c.c)||0) : sum, 0);
}

function validate(){
  const issues = [];
  const cum = cumulative();
  const max = Number(state.meta.maxCr)||0;

  state.courses.forEach(c=>{
    (c.p||[]).forEach(pid=>{
      const p = byId(pid);
      if(!p){
        issues.push({type:"err", id:c.id, msg:`${c.name} apunta a un prerrequisito que ya no existe (${pid}).`});
        return;
      }
      if(p.s >= c.s){
        const rel = p.s === c.s ? "en el mismo semestre" : `${p.s - c.s} semestre(s) después`;
        issues.push({type:"err", id:c.id, other:p.id,
          msg:`${c.name} (sem ${c.s}) tiene como prerrequisito ${p.name}, que está ${rel} (sem ${p.s}).`});
      }
    });
    if(c.cr){
      const disp = creditsBefore(c.s);
      if(disp < c.cr){
        issues.push({type:"err", id:c.id,
          msg:`${c.name} exige ${c.cr} créditos aprobados y en sem ${c.s} solo se acumulan ${disp}.`});
      }
    }
  });

  const t = semCredits();
  for(let s=1;s<=N_SEM;s++){
    if(max>0 && t[s]>max){
      issues.push({type:"warn", sem:s, msg:`Semestre ${s} llega a ${t[s]} créditos y el tope fijado es ${max}.`});
    }
  }
  // ciclos
  const color = {};
  const cyc = [];
  function dfs(id, stack){
    if(color[id]===2) return;
    if(color[id]===1){ cyc.push(stack.slice(stack.indexOf(id)).join(" → ")); return; }
    color[id]=1; stack.push(id);
    const c = byId(id);
    (c && c.p || []).forEach(p=>{ if(byId(p)) dfs(p, stack); });
    stack.pop(); color[id]=2;
  }
  state.courses.forEach(c=>dfs(c.id,[]));
  [...new Set(cyc)].forEach(path=> issues.push({type:"err", msg:`Cadena circular de prerrequisitos: ${path}.`}));

  return {issues, cum, sem:t};
}

/* ============================================================
   4. Render
   ============================================================ */
const grid = document.getElementById("grid");
const svg  = document.getElementById("svg");

function render(){
  const {issues, cum, sem} = validate();
  const badIds = new Set(issues.filter(i=>i.type==="err" && i.id).map(i=>i.id));
  const max = Number(state.meta.maxCr)||0;
  const total = cum[N_SEM];
  const maxSemCr = Math.max(...sem.slice(1), 1);

  grid.innerHTML = "";
  for(let s=1;s<=N_SEM;s++){
    const col = document.createElement("div");
    col.className = "col";

    const band = document.createElement("div");
    band.className = "yearband";
    const prevYear = s>1 ? YEAR_OF[s-2] : null;
    band.innerHTML =
      `<div class="year">${YEAR_OF[s-1]!==prevYear ? YEAR_OF[s-1]+"º año" : "&nbsp;"}</div>
       <div class="head${max>0 && sem[s]>max ? " over":""}">
         <h3>${s}º semestre</h3>
         <div class="metrics"><span class="cr">${sem[s]}</span><span class="cum">acum ${cum[s]}</span></div>
       </div>
       <div class="ruler"><i style="width:${Math.round(sem[s]/maxSemCr*100)}%"></i></div>`;
    col.appendChild(band);

    // banderas de hito de créditos (100 / 170) en el semestre donde se alcanzan
    const flags = [];
    state.courses.filter(c=>c.cr).forEach(c=>{
      if(cum[s] >= c.cr && (s===1 || cum[s-1] < c.cr)) flags.push(`${c.cr} cr · ${c.name}`);
    });
    if(flags.length){
      const m = document.createElement("div");
      m.className = "milestone";
      m.innerHTML = flags.map(f=>`<div class="flag">${f}</div>`).join("");
      col.appendChild(m);
      col.style.paddingTop = (flags.length*14)+"px";
    }

    const body = document.createElement("div");
    body.className = "body";
    body.dataset.sem = s;
    ofSem(s).forEach(c => body.appendChild(cardEl(c, badIds)));
    wireDrop(body, s);
    col.appendChild(body);
    grid.appendChild(col);
  }

  document.getElementById("kTot").textContent = total;
  document.getElementById("kCur").textContent = state.courses.length;
  const nErr = issues.filter(i=>i.type==="err").length;
  const nWarn = issues.filter(i=>i.type==="warn").length;
  document.getElementById("kIssues").textContent = nErr + (nWarn?` +${nWarn}`:"");
  document.getElementById("kIssuesBox").className = nErr ? "bad" : (nWarn ? "" : "good");
  document.getElementById("planName").textContent = state.meta.name;

  requestAnimationFrame(()=>drawArrows(issues));
  if(drawerView==="issues") renderIssues(issues);
  else if(selected) renderInspector();
}

function cardEl(c, badIds){
  const el = document.createElement("div");
  el.className = "card" + (c.k?" key":"") + (c.b?" bl":"") +
                 (selected===c.id?" sel":"") + (badIds.has(c.id)?" err":"") +
                 (linkFrom===c.id?" linking-src":"");
  el.style.background = (AREAS[c.a]||{}).color || "#999";
  el.draggable = true;
  el.tabIndex = 0;
  el.dataset.id = c.id;
  el.innerHTML =
    `<span class="cr">${c.c}</span>
     <div class="code">${escapeHtml(c.code||"")}</div>
     <div class="name">${escapeHtml(c.name)}</div>`;
  if(badIds.has(c.id)){
    const b = document.createElement("span"); b.className="bug"; b.textContent="!"; el.appendChild(b);
  }
  el.addEventListener("click", e=>{ e.stopPropagation(); onCardClick(c.id); });
  el.addEventListener("keydown", e=>{
    if(e.key==="Enter"||e.key===" "){ e.preventDefault(); onCardClick(c.id); }
    if(e.key==="Delete"){ e.preventDefault(); removeCourse(c.id); }
    if(e.key==="["){ e.preventDefault(); moveSem(c.id,-1); }
    if(e.key==="]"){ e.preventDefault(); moveSem(c.id, 1); }
  });
  el.addEventListener("mouseenter", ()=>{ hovered=c.id; if(arrowMode==="focus") drawArrows(validate().issues); });
  el.addEventListener("mouseleave", ()=>{ hovered=null; if(arrowMode==="focus") drawArrows(validate().issues); });
  el.addEventListener("dragstart", e=>{
    dragId = c.id; e.dataTransfer.effectAllowed="move";
    e.dataTransfer.setData("text/plain", c.id);
    setTimeout(()=>el.classList.add("dragging"),0);
  });
  el.addEventListener("dragend", ()=>{ dragId=null; el.classList.remove("dragging"); clearDropLine(); });
  return el;
}

let dragId = null;
function clearDropLine(){ document.querySelectorAll(".drop-line").forEach(n=>n.remove());
  document.querySelectorAll(".body.dragover").forEach(n=>n.classList.remove("dragover")); }

function wireDrop(body, sem){
  body.addEventListener("dragover", e=>{
    e.preventDefault(); e.dataTransfer.dropEffect="move";
    clearDropLine(); body.classList.add("dragover");
    const after = afterElement(body, e.clientY);
    const line = document.createElement("div"); line.className="drop-line";
    if(after) body.insertBefore(line, after); else body.appendChild(line);
  });
  body.addEventListener("dragleave", e=>{ if(!body.contains(e.relatedTarget)) clearDropLine(); });
  body.addEventListener("drop", e=>{
    e.preventDefault();
    const id = dragId || e.dataTransfer.getData("text/plain");
    const after = afterElement(body, e.clientY);
    clearDropLine();
    if(id) moveCourse(id, sem, after ? after.dataset.id : null);
  });
}
function afterElement(body, y){
  const cards = [...body.querySelectorAll(".card:not(.dragging)")];
  return cards.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    return (offset < 0 && offset > closest.offset) ? {offset, el:child} : closest;
  }, {offset: -Infinity, el:null}).el;
}

/* --- flechas --- */
function drawArrows(issues){
  const board = document.getElementById("board");
  const bRect = board.getBoundingClientRect();
  svg.setAttribute("width", board.scrollWidth);
  svg.setAttribute("height", board.scrollHeight);
  svg.innerHTML = `<defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#7C90A6" stroke="none"/></marker>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#6D28D9" stroke="none"/></marker>
    <marker id="ab" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#D92D3F" stroke="none"/></marker></defs>`;

  const pos = {};
  document.querySelectorAll(".card").forEach(el=>{
    const r = el.getBoundingClientRect();
    pos[el.dataset.id] = {
      x1: r.left - bRect.left + board.scrollLeft*0, // rects ya incluyen scroll del wrap
      y:  r.top - bRect.top + r.height/2,
      l:  r.left - bRect.left,
      r:  r.right - bRect.left
    };
  });

  const focus = selected || hovered;
  const dim = new Set();
  const frag = [];

  state.courses.forEach(c=>{
    (c.p||[]).forEach(pid=>{
      const p = byId(pid); if(!p) return;
      const A = pos[pid], B = pos[c.id]; if(!A||!B) return;
      const bad = p.s >= c.s;
      const touches = focus && (focus===c.id || focus===pid);
      let show = false;
      if(arrowMode==="all") show = true;
      else if(arrowMode==="errors") show = bad;
      else show = bad || touches;
      if(!show) return;
      if(touches){ dim.add(c.id); dim.add(pid); }

      const x1 = A.r, y1 = A.y, x2 = B.l - 7, y2 = B.y;
      const dx = Math.max(28, Math.abs(x2-x1)*0.45);
      const cls = bad ? "bad" : (touches ? "hi" : "");
      const mk  = bad ? "ab" : (touches ? "ah" : "a");
      let d;
      if(x2 > x1){
        d = `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
      }else{ // va hacia atrás: rodea por abajo para que se vea el conflicto
        const yb = Math.max(y1,y2) + 46;
        d = `M${x1},${y1} C${x1+40},${yb} ${x2-40},${yb} ${x2},${y2}`;
      }
      frag.push(`<path class="${cls}" d="${d}" marker-end="url(#${mk})"/>`);
    });
  });
  svg.insertAdjacentHTML("beforeend", frag.join(""));

  document.querySelectorAll(".card").forEach(el=>{
    el.classList.toggle("dim", !!focus && arrowMode==="focus" && dim.size>0 && !dim.has(el.dataset.id));
  });
}

/* ============================================================
   5. Acciones sobre la malla
   ============================================================ */
function moveCourse(id, sem, beforeId){
  const c = byId(id); if(!c) return;
  if(c.s===sem && !beforeId) { /* igual reordena */ }
  snapshot();
  const arr = state.courses;
  const i = arr.findIndex(x=>x.id===id);
  const [cur] = arr.splice(i,1);
  cur.s = sem;
  if(beforeId && beforeId!==id){
    const j = arr.findIndex(x=>x.id===beforeId);
    arr.splice(j<0?arr.length:j, 0, cur);
  }else{
    let last=-1; arr.forEach((x,k)=>{ if(x.s===sem) last=k; });
    arr.splice(last+1, 0, cur);
  }
  render();
}
function moveSem(id, delta){
  const c = byId(id); if(!c) return;
  const s = Math.min(N_SEM, Math.max(1, c.s+delta));
  if(s!==c.s){ moveCourse(id, s, null); toast(`${c.name} → semestre ${s}`); }
}
function removeCourse(id){
  const c = byId(id); if(!c) return;
  const deps = state.courses.filter(x=>(x.p||[]).includes(id));
  const msg = deps.length
    ? `Eliminar ${c.name}. Es prerrequisito de ${deps.length} ramo(s); esas flechas también se borran.`
    : `Eliminar ${c.name}.`;
  if(!confirm(msg+"\n\n¿Continuar?")) return;
  snapshot();
  state.courses = state.courses.filter(x=>x.id!==id);
  state.courses.forEach(x=> x.p = (x.p||[]).filter(p=>p!==id));
  if(selected===id){ selected=null; closeDrawer(); }
  render(); toast("Ramo eliminado");
}
function addCourse(){
  snapshot();
  let n=1, id;
  do{ id = "NUEVO"+n++; }while(byId(id));
  const c = {id, code:"—", name:"Ramo nuevo", c:3, a:"especialidad", s:1, p:[]};
  state.courses.push(c);
  selected = id; drawerView="course"; openDrawer();
  render();
  setTimeout(()=>{ const f=document.getElementById("fName"); if(f){f.focus(); f.select();} },60);
}
function addPrereq(id, pid){
  const c = byId(id); if(!c || !pid || pid===id) return;
  c.p = c.p||[];
  if(c.p.includes(pid)){ toast("Esa flecha ya existe"); return; }
  snapshot();
  c.p.push(pid);
  render(); toast("Prerrequisito agregado");
}
function removePrereq(id, pid){
  const c = byId(id); if(!c) return;
  snapshot();
  c.p = (c.p||[]).filter(p=>p!==pid);
  render(); toast("Prerrequisito eliminado");
}
function onCardClick(id){
  if(linkMode){
    if(!linkFrom){ linkFrom = id; toast("Ahora elige el ramo que lo tiene como prerrequisito"); render(); return; }
    if(linkFrom===id){ linkFrom=null; render(); return; }
    addPrereq(id, linkFrom);
    linkFrom = null; setLinkMode(false); return;
  }
  selected = id; drawerView="course"; openDrawer(); render();
}
function setLinkMode(on){
  linkMode = on; if(!on) linkFrom=null;
  document.getElementById("bLink").classList.toggle("on", on);
  document.body.style.cursor = on ? "crosshair" : "";
  if(on) toast("Modo conectar: elige el ramo prerrequisito (origen)");
  render();
}

  }).join("") || `<p class="empty">Sin prerrequisitos.</p>`;

    <label class="lbl">Nombre<input id="fName" value="${escapeAttr(c.name)}"></label>
    <div class="row2">
      <label class="lbl">Código<input id="fCode" value="${escapeAttr(c.code||"")}"></label>

      <label class="lbl">Área<select id="fArea">${opts}</select></label>
      <label class="lbl">Semestre<select id="fSem">${sems}</select></label>
    </div>

      <input id="fReq" type="number" min="0" max="250" value="${c.cr||0}"></label>

      <label><input type="checkbox" id="fKey" ${c.k?"checked":""}> Asignatura clave</label>

      <div style="display:flex;gap:6px;margin-top:8px">
        <select id="fAddPre" style="flex:1;background:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:6px;font-size:12px">
          <option value="">Agregar prerrequisito…</option>${others}
        </select>
      </div>
    </div>
    <div class="sect">
      <h4>Lo tienen como prerrequisito</h4>
      ${depList}
    </div>
    <div class="sect" style="display:flex;gap:8px">
      <button class="btn" id="fDup">Duplicar</button>
      <button class="btn" id="fDel" style="border-color:#E3AAB1;color:#B31F30">Eliminar ramo</button>
    </div>
    <p class="hint">Atajos: arrastra la tarjeta para moverla, <b>[</b> y <b>]</b> la corren de semestre, <b>Supr</b> la elimina.</p>`;

  const upd = (f)=>{ snapshot(); f(); render(); };
  document.getElementById("fName").addEventListener("change", e=> upd(()=> c.name = e.target.value.trim() || "Sin nombre"));
  document.getElementById("fCode").addEventListener("change", e=> upd(()=> c.code = e.target.value.trim()));

  document.getElementById("fSem").addEventListener("change", e=> moveCourse(c.id, Number(e.target.value), null));
  document.getElementById("fReq").addEventListener("change", e=> upd(()=>{ const v=Number(e.target.value)||0; if(v>0) c.cr=v; else delete c.cr; }));
  document.getElementById("fKey").addEventListener("change", e=> upd(()=>{ if(e.target.checked) c.k=true; else delete c.k; }));
  document.getElementById("fBl").addEventListener("change", e=> upd(()=>{ if(e.target.checked) c.b=true; else delete c.b; }));
  document.getElementById("fAddPre").addEventListener("change", e=>{ if(e.target.value) addPrereq(c.id, e.target.value); });
  drawerBody.querySelectorAll("[data-rm]").forEach(b=> b.addEventListener("click", ()=> removePrereq(c.id, b.dataset.rm)));
  document.getElementById("fDel").addEventListener("click", ()=> removeCourse(c.id));

    const copy = clone(c); copy.id=id; copy.name = c.name+" (copia)";
    state.courses.push(copy); selected=id; render();
  });
}

function renderIssues(issues){
  document.getElementById("drawerTitle").textContent = "Conflictos";
  const errs = issues.filter(i=>i.type==="err");
  const warns = issues.filter(i=>i.type==="warn");
  if(!issues.length){
    drawerBody.innerHTML = `<p class="hint">Todo cuadra: cada prerrequisito va antes que su ramo, los hitos de créditos se cumplen y ningún semestre pasa el tope.</p>`;
    return;
  }
  drawerBody.innerHTML =
    (errs.length ? `<div><h4 style="margin:0 0 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--danger)">Errores (${errs.length})</h4>
      ${errs.map(i=>`<div class="issue" data-go="${i.id||""}">${escapeHtml(i.msg)}</div>`).join("")}</div>`:"") +
    (warns.length ? `<div class="sect"><h4 style="color:var(--warn)">Avisos (${warns.length})</h4>
      ${warns.map(i=>`<div class="issue warn">${escapeHtml(i.msg)}</div>`).join("")}</div>`:"");
  drawerBody.querySelectorAll("[data-go]").forEach(d=> d.addEventListener("click", ()=>{

    const el = document.querySelector(`.card[data-id="${id}"]`);
    if(el) el.scrollIntoView({behavior:"smooth", block:"center", inline:"center"});
  }));
}

function download(name, text, type){
  const blob = new Blob([text], {type: type||"application/json;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function toCsv(){
  const head = ["id","codigo","nombre","creditos","area","semestre","prerrequisitos","creditos_exigidos","clave","blearning"];
  const rows = state.courses.map(c=>[
    c.id, c.code||"", c.name, c.c, (AREAS[c.a]||{}).label||c.a, c.s,
    (c.p||[]).join(" | "), c.cr||"", c.k?"sí":"", c.b?"sí":""
  ]);
  return [head,...rows].map(r=>r.map(v=>{
    const s = String(v??"");
    return /[";,\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(";")).join("\n");
}

/* ============================================================
   Exportar la malla como imagen (SVG vectorial y PNG)
   El SVG se dibuja desde cero a partir de los datos, no es una
   captura de pantalla: sale limpio y editable en Illustrator o Inkscape.
   ============================================================ */
const _m = document.createElement("canvas").getContext("2d");
function _wrap(text, font, maxW){
  _m.font = font;
  const words = String(text).split(/\s+/); const lines = []; let cur = "";
  words.forEach(w=>{
    const t = cur ? cur+" "+w : w;
    if(_m.measureText(t).width <= maxW || !cur) cur = t;
    else { lines.push(cur); cur = w; }
  });
  if(cur) lines.push(cur);
  return lines;
}
function _esc(t){ return String(t??"").replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

function buildSvg(){
  const SANS = "Arial, Helvetica, sans-serif", MONO = "'Courier New', Courier, monospace";
  const M = 26, COLW = 182, GAP = 12, PAD = 9;
  const TITLE_H = 52, YEAR_H = 16, HEAD_H = 44, RULER_H = 6, CARD_GAP = 8;
  const {issues, cum, sem} = validate();
  const badIds = new Set(issues.filter(i=>i.type==="err" && i.id).map(i=>i.id));
  const max = Number(state.meta.maxCr)||0;
  const maxSemCr = Math.max(...sem.slice(1),1);

  // banda de banderas de hito (100 / 170 créditos)
  const flagsBy = {}; let maxFlags = 0;
  for(let sN=1; sN<=N_SEM; sN++){
    const f = state.courses.filter(c=>c.cr && cum[sN]>=c.cr && (sN===1 || cum[sN-1]<c.cr))
                           .map(c=>`${c.cr} cr · ${c.name}`);
    flagsBy[sN]=f; maxFlags = Math.max(maxFlags, f.length);
  }
  const FLAG_H = maxFlags*14 + (maxFlags?6:0);

  // geometría de cada tarjeta
  const geo = {}; const cols = []; let bodyTop = M + TITLE_H + YEAR_H + HEAD_H + RULER_H + FLAG_H;
  let maxBottom = bodyTop;
  for(let sN=1; sN<=N_SEM; sN++){
    const x = M + (sN-1)*(COLW+GAP);
    let y = bodyTop + PAD;
    const items = ofSem(sN).map(c=>{
      const nameLines = _wrap(c.name, "600 11.5px "+SANS, COLW-2*PAD-22);
      const h = 8 + 12 + nameLines.length*13.5 + 6;
      const g = {x:x+PAD, y, w:COLW-2*PAD, h, lines:nameLines, c};
      geo[c.id] = g; y += h + CARD_GAP;
      return g;
    });
    const colH = Math.max(y - bodyTop + PAD - CARD_GAP, 90);
    cols.push({sN, x, items, colH});
    maxBottom = Math.max(maxBottom, bodyTop + colH);
  }
  const bodyH = maxBottom - bodyTop;
  const legendY = maxBottom + 26;
  const W = M*2 + N_SEM*COLW + (N_SEM-1)*GAP;
  const H = legendY + 52;

  let o = "";
  o += `<rect width="${W}" height="${H}" fill="#FFFFFF"/>`;
  o += `<text x="${M}" y="${M+16}" font-family="${SANS}" font-size="17" font-weight="700" fill="#12202E">`
     + `${_esc(state.meta.name)}</text>`;
  o += `<text x="${M}" y="${M+34}" font-family="${MONO}" font-size="11" fill="#5E7185">`
     + `${cum[N_SEM]} créditos · ${state.courses.length} asignaturas · ${N_SEM} semestres`
     + `${badIds.size ? " · "+badIds.size+" con conflicto" : ""}</text>`;

  // columnas: año, cabecera, regla, banderas, marco del cuerpo
  cols.forEach(({sN,x,colH})=>{
    const headY = M + TITLE_H + YEAR_H;
    const over = max>0 && sem[sN]>max;
    if(YEAR_OF[sN-1] !== (sN>1 ? YEAR_OF[sN-2] : null)){
      o += `<text x="${x+2}" y="${headY-5}" font-family="${MONO}" font-size="9.5" letter-spacing="1.6" `
         + `fill="#5E7185">${YEAR_OF[sN-1]}º AÑO</text>`;
    }
    o += `<rect x="${x}" y="${headY}" width="${COLW}" height="${HEAD_H}" rx="6" fill="#F7F9FB" `
       + `stroke="${over?"#B4700A":"#C4D0DD"}"/>`;
    o += `<text x="${x+10}" y="${headY+16}" font-family="${SANS}" font-size="11.5" font-weight="700" `
       + `fill="#12202E">${sN}º semestre</text>`;
    o += `<text x="${x+10}" y="${headY+36}" font-family="${MONO}" font-size="17" font-weight="700" `
       + `fill="${over?"#B4700A":"#12202E"}">${sem[sN]}</text>`;
    o += `<text x="${x+10+String(sem[sN]).length*11+6}" y="${headY+36}" font-family="${MONO}" `
       + `font-size="10" fill="#5E7185">acum ${cum[sN]}</text>`;
    const rw = Math.round(sem[sN]/maxSemCr*(COLW-2));
    o += `<rect x="${x+1}" y="${headY+HEAD_H+2}" width="${COLW-2}" height="${RULER_H}" fill="#E4EAF1"/>`;
    o += `<rect x="${x+1}" y="${headY+HEAD_H+2}" width="${rw}" height="${RULER_H}" fill="${over?"#B4700A":"#5C748C"}"/>`;
    (flagsBy[sN]||[]).forEach((f,i)=>{
      const fy = headY + HEAD_H + RULER_H + 8 + i*14;
      o += `<line x1="${x}" y1="${fy-6}" x2="${x+COLW}" y2="${fy-6}" stroke="#6D28D9" stroke-width="1" stroke-dasharray="3 3"/>`;
      _m.font = "9px "+MONO;
      let ft = f;
      while(_m.measureText(ft).width > COLW-6 && ft.length > 6) ft = ft.slice(0,-2);
      if(ft !== f) ft = ft.slice(0,-1)+"…";
      o += `<text x="${x+2}" y="${fy+3}" font-family="${MONO}" font-size="9" fill="#6D28D9">${_esc(ft)}</text>`;
    });
    o += `<rect x="${x}" y="${bodyTop}" width="${COLW}" height="${bodyH}" rx="6" fill="#FBFCFD" stroke="#D7E0E9"/>`;
  });

  // flechas (debajo de las tarjetas)
  let arrows = "";
  state.courses.forEach(c=>{
    (c.p||[]).forEach(pid=>{
      const p = byId(pid); if(!p) return;
      const A = geo[pid], B = geo[c.id]; if(!A||!B) return;
      const bad = p.s >= c.s;
      const x1 = A.x+A.w, y1 = A.y+A.h/2, x2 = B.x-7, y2 = B.y+B.h/2;
      let d;
      if(x2 > x1){
        const dx = Math.max(26, Math.abs(x2-x1)*0.45);
        d = `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
      }else{
        const yb = Math.max(y1,y2) + 46;
        d = `M${x1},${y1} C${x1+40},${yb} ${x2-40},${yb} ${x2},${y2}`;
      }
      arrows += `<path d="${d}" fill="none" stroke="${bad?"#D92D3F":"#7C90A6"}" stroke-width="${bad?2:1.4}"`
              + `${bad?' stroke-dasharray="6 4"':""} marker-end="url(#${bad?"mkBad":"mkOk"})"/>`;
    });
  });
  o += arrows;

  // tarjetas
  Object.values(geo).forEach(g=>{
    const c = g.c, col = (AREAS[c.a]||{}).color || "#9AA7B4";
    const bad = badIds.has(c.id);
    o += `<rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="5" fill="${col}" `
       + `stroke="${bad?"#D92D3F":"#233240"}" stroke-width="${bad?2.5:(c.k?2.5:1.2)}"`
       + `${c.b?' stroke-dasharray="3 2.5"':""}/>`;
    o += `<rect x="${g.x+g.w-24}" y="${g.y+5}" width="19" height="13" rx="3" fill="rgba(0,0,0,0.16)"/>`;
    o += `<text x="${g.x+g.w-14.5}" y="${g.y+15}" text-anchor="middle" font-family="${MONO}" font-size="10.5" `
       + `font-weight="700" fill="#0E1720">${c.c}</text>`;
    o += `<text x="${g.x+8}" y="${g.y+15}" font-family="${MONO}" font-size="9.5" font-weight="700" `
       + `fill="#0E1720" opacity="0.75">${_esc(c.code||"")}</text>`;
    g.lines.forEach((ln,i)=>{
      o += `<text x="${g.x+8}" y="${g.y+28+i*13.5}" font-family="${SANS}" font-size="11.5" font-weight="600" `
         + `fill="#0E1720">${_esc(ln)}</text>`;
    });
  });

  // leyenda
  let lx = M;
  Object.values(AREAS).forEach(a=>{
    o += `<rect x="${lx}" y="${legendY}" width="11" height="11" rx="2.5" fill="${a.color}" stroke="#233240" stroke-width="0.8"/>`;
    o += `<text x="${lx+16}" y="${legendY+9.5}" font-family="${SANS}" font-size="10.5" fill="#3B4C5D">${_esc(a.label)}</text>`;
    _m.font = "10.5px "+SANS;
    lx += 16 + _m.measureText(a.label).width + 18;
  });
  o += `<text x="${M}" y="${legendY+30}" font-family="${SANS}" font-size="10" fill="#5E7185">`
     + `Borde grueso: asignatura clave · Borde punteado: b-learning · Rojo: conflicto de prerrequisito`
     + ` — generado el ${new Date().toLocaleDateString("es-CL")}</text>`;

  const defs = `<defs>
    <marker id="mkOk" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#7C90A6"/></marker>
    <marker id="mkBad" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#D92D3F"/></marker></defs>`;

  return {svg:`<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${defs}${o}</svg>`,
          w:W, h:H};
}

function fileBase(){ return (state.meta.name||"malla").replace(/[^\w\-]+/g,"_").slice(0,40); }
function exportSvg(){
  const {svg} = buildSvg();
  download(fileBase()+".svg", svg, "image/svg+xml;charset=utf-8");
  toast("SVG descargado (vectorial, editable)");
}
function exportPng(scale){
  const {svg,w,h} = buildSvg();
  const img = new Image();
  img.onload = ()=>{
    const cv = document.createElement("canvas");
    cv.width = Math.round(w*scale); cv.height = Math.round(h*scale);
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>{
      if(!b){ toast("El navegador no pudo generar el PNG"); return; }
      const url = URL.createObjectURL(b);
      const a = document.createElement("a"); a.href=url; a.download=fileBase()+".png"; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      toast(`PNG descargado (${cv.width}×${cv.height} px)`);
    }, "image/png");
  };
  img.onerror = ()=> toast("No se pudo generar el PNG; prueba con SVG");
  img.src = "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
document.getElementById("bSvg").addEventListener("click", exportSvg);
document.getElementById("bPng").addEventListener("click", ()=> exportPng(2));

/* --- distribución por área --- */
function donutSvg(slices, total, unit){
  const S=230, R=100, r=58, C=S/2;
  if(!total) return `<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}"><circle cx="${C}" cy="${C}" r="${R}" fill="#E4EAF1"/></svg>`;
  let ang = -Math.PI/2, paths = "";
  slices.forEach(sl=>{
    const frac = sl.value/total;
    if(frac<=0) return;
    const a0 = ang, a1 = ang + frac*Math.PI*2; ang = a1;
    const pt=(a,rad)=>[(C+rad*Math.cos(a)).toFixed(2),(C+rad*Math.sin(a)).toFixed(2)];
    let d;
    if(frac>=0.9999){
      d = `M${C-R},${C} A${R},${R} 0 1,1 ${C+R},${C} A${R},${R} 0 1,1 ${C-R},${C} `
        + `M${C-r},${C} A${r},${r} 0 1,0 ${C+r},${C} A${r},${r} 0 1,0 ${C-r},${C}Z`;
    }else{
      const big = (a1-a0) > Math.PI ? 1 : 0;
      const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r),[x3,y3]=pt(a0,r);
      d = `M${x0},${y0} A${R},${R} 0 ${big},1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${big},0 ${x3},${y3} Z`;
    }
    const pct = (frac*100).toFixed(1).replace(".",",");
    paths += `<path d="${d}" fill="${sl.color}" stroke="#fff" stroke-width="1.5" fill-rule="evenodd">`
           + `<title>${sl.label}: ${sl.value} ${unit} (${pct}%)</title></path>`;
  });
  return `<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}">${paths}
    <text x="${C}" y="${C-2}" text-anchor="middle" font-family="var(--font-mono)" font-size="30"
      font-weight="600" fill="#12202E">${total}</text>
    <text x="${C}" y="${C+18}" text-anchor="middle" font-family="var(--font-sans)" font-size="11"
      letter-spacing="1.2" fill="#5E7185">${unit.toUpperCase()}</text></svg>`;
}

function renderDist(){
  const rows = Object.entries(AREAS).map(([k,v])=>{
    const list = state.courses.filter(c=>c.a===k);
    return {key:k, label:v.label, color:v.color,
            n:list.length, cr:list.reduce((t,c)=>t+(Number(c.c)||0),0)};
  });
  // áreas creadas a mano que no estén en el catálogo
  const extra = {};
  state.courses.filter(c=>!AREAS[c.a]).forEach(c=>{
    extra[c.a] = extra[c.a] || {key:c.a, label:c.a+" (sin área)", color:"#9AA7B4", n:0, cr:0};
    extra[c.a].n++; extra[c.a].cr += Number(c.c)||0;
  });
  const all = rows.concat(Object.values(extra)).filter(r=>r.n>0);
  const totN = all.reduce((t,r)=>t+r.n,0);
  const totC = all.reduce((t,r)=>t+r.cr,0);
  const pct = (v,t)=> t ? (v/t*100).toFixed(1).replace(".",",")+"%" : "—";

  const byCr = [...all].sort((a,b)=>b.cr-a.cr);
  const byN  = [...all].sort((a,b)=>b.n-a.n);

  document.getElementById("distBody").innerHTML = `
    <div class="charts">
      <div class="chart"><h3>Por créditos</h3>
        ${donutSvg(byCr.map(r=>({label:r.label,color:r.color,value:r.cr})), totC, "créditos")}</div>
      <div class="chart"><h3>Por número de asignaturas</h3>
        ${donutSvg(byN.map(r=>({label:r.label,color:r.color,value:r.n})), totN, "ramos")}</div>
    </div>
    <table class="dist">
      <thead><tr><th>Área</th><th>Asignaturas</th><th>% ramos</th><th>Créditos</th><th>% créditos</th><th>Cr/ramo</th></tr></thead>
      <tbody>
        ${byCr.map(r=>`<tr>
          <td><i style="background:${r.color}"></i>${escapeHtml(r.label)}</td>
          <td>${r.n}</td><td>${pct(r.n,totN)}</td>
          <td>${r.cr}</td><td>${pct(r.cr,totC)}</td>
          <td>${r.n ? (r.cr/r.n).toFixed(1).replace(".",",") : "—"}</td></tr>`).join("")}
        <tr class="tot"><td>Total</td><td>${totN}</td><td>100%</td><td>${totC}</td><td>100%</td>
          <td>${totN ? (totC/totN).toFixed(1).replace(".",",") : "—"}</td></tr>
      </tbody>
    </table>
    <p class="hint" style="margin-top:14px">Se recalcula con la malla que tengas en pantalla, así que sirve para comparar una propuesta con la original antes de guardarla.</p>`;
}
const distBack = document.getElementById("distBack");
document.getElementById("bDist").addEventListener("click", ()=>{ renderDist(); distBack.classList.add("open"); });
document.getElementById("distClose").addEventListener("click", ()=> distBack.classList.remove("open"));
distBack.addEventListener("click", e=>{ if(e.target===distBack) distBack.classList.remove("open"); });
document.getElementById("distPrint").addEventListener("click", ()=>{
  document.body.classList.add("print-dist");
  window.print();
  setTimeout(()=>document.body.classList.remove("print-dist"), 500);
});

// leyenda
document.getElementById("legend").innerHTML =
  Object.values(AREAS).map(a=>`<span><i style="background:${a.color}"></i>${a.label}</span>`).join("") +
  `<span style="margin-left:auto">Borde grueso: asignatura clave · Borde punteado: b-learning · Rojo: conflicto</span>`;

render();
</script>
